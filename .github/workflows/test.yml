name: Run OpKey Task

on:
  workflow_dispatch:

jobs:
  run-cli:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run OpKey Task
        run: java -jar OpKeyCLI-0.6-jar-with-dependencies.jar --hostname "https://qa1.perf-eks.opkeyone.com/" --username "${{ secrets.OPKEY_USERNAME }}" --apikey "${{ secrets.OPKEY_API_KEY }}" --project "RJ_perf_main" --module devopstask --command run --task-path "Project Workspace\ExportConfigurations_2026_08_20 15_57_32_572"
